; Firmware del ESP32 del carrito Aether (motores M0601, sensores, paro).
;
; El MISMO programa (src/) se compila de dos formas:
;   pio run -e esp32dev -t upload   -> al ESP32 real del carrito (por USB)
;   pio run -e native               -> a un programa de la PC que se conecta al simulador (sim/servidor.py)
; En el entorno native, la carpeta lib/sim_hal reemplaza a Arduino: cada digitalWrite, Serial2.write
; o lectura de un VL53L0X se le pide al ESP32 virtual del simulador por TCP (puerto 7700).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit BNO055@^1.6.3
lib_ignore = sim_hal
lib_ldf_mode = deep+

[env:native]
platform = native
build_flags = -std=gnu++17 -DSIM_NATIVO -lws2_32 -lwinmm
lib_compat_mode = off
