<text x="660.0" y="237.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">5 juicios iguales seguidos antes de</text><text x="660.0" y="254.55" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">actuar</text><rect x="830" y="92" width="300" height="246" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="980.0" y="193.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Raspberry Pi 4: juicio PASS / FAIL,</text><text x="980.0" y="210.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">temporizador y salidas</text><text x="980.0" y="228.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">LOGO!: secuencia de la banda (ignora</text><text x="980.0" y="245.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">su infrarrojo 5 s)</text><rect x="1150" y="92" width="300" height="246" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="1300.0" y="193.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Relevador GPIO 8 → electroválvula de</text><text x="1300.0" y="210.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">24 V → pistón</text><text x="1300.0" y="228.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Relevador GPIO 9 → entrada I4 del</text><text x="1300.0" y="245.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">LOGO! → motor de la banda</text><rect x="1470" y="92" width="300" height="246" rx="10" fill="#EBE3F6" stroke="#7B52B5" stroke-width="2"/><text x="1620.0" y="202.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">PASS: la pieza sigue hacia el carrito</text><text x="1620.0" y="219.55" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">FAIL: la pieza es expulsada (scrap)</text><text x="1620.0" y="237.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Evento de pieza a la laptop</text><polyline points="490,215.0 510,215.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="810,215.0 830,215.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="1130,215.0 1150,215.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="1450,215.0 1470,215.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="10" y="420" width="1780" height="330" rx="10" fill="#FAFBFC" stroke="#C9D1DB" stroke-width="1.5"/><rect x="20" y="430" width="150" height="310" rx="10" fill="#1B2A41" stroke="#1B2A41" stroke-width="2"/><text x="95.0" y="571.125" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">ROBOT DE</text><text x="95.0" y="589.875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">TRANSPORTE</text><text x="95.0" y="608.625" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">(carrito)</text><rect x="190" y="432" width="300" height="306" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="340.0" y="563.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Fixture que llega por la banda (QR y</text><text x="340.0" y="580.8" font-fa