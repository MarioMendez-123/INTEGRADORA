<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7685"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="900" y="36.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" text-anchor="middle" fill="#1B2A41">Conexiones del ESP32 (mapa de pines de diseño, revisión 3.8)</text><rect x="740" y="330" width="320" height="330" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="900.0" y="450.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B2A41">ESP32 DevKitC</text><text x="900.0" y="470.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B2A41">38 pines</text><text x="900.0" y="490.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B2A41">3.3 V lógico</text><text x="900.0" y="510.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B2A41"></text><text x="900.0" y="530.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B2A41">alimentado a 5 V por el reductor</text><text x="900.0" y="550.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B2A41">XL4005</text><rect x="60" y="110" width="360" height="112" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="240.0" y="153.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">A4988 #1 y #2 · elevador (2 × NEMA 17)</text><text x="240.0" y="170.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">STEP y DIR compartidos</text><text x="240.0" y="186.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 25 STEP · GPIO 26 DIR</text><polyline points="740,380 420,166.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="60" y="240" width="360" height="112" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="240.0" y="292.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">A4988 #3 · empujador (NEMA 17)</text><text x="240.0" y="308.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 27 STEP · GPIO 14 DIR</text><polyline points="740,420 420,296.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="60" y="370" width="360" height="102" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="240.0" y="408.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">ENABLE de los 3 drivers</text><text x="240.0" y="425.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">resistencia de 10 kΩ a 3.3 V</text><text x="240.0" y="441.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 13</text><polyline points="740,460 420,421.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="60" y="490" width="360" height="112" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="240.0" y="533.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Servo MG90S de la uña</text><text x="240.0" y="550.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">(5 V del XL4005)</text><text x="240.0" y="566.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 5 · PWM</text><polyline points="740,500 420,546.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="60" y="610" width="360" height="102" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="240.0" y="657.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Tira WS2812 (opcional) con resistencia de 330 Ω</text><text x="240.0" y="673.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 2</text><polyline points="740,540 420,661.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="1380" y="110" width="360" height="112" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="1560.0" y="153.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">MAX485 → bus RS485 (A, B)</text><text x="1560.0" y="170.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">2 motores-rueda M0601 (ID 1 y 2)</text><text x="1560.0" y="186.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 17 DI · GPIO 4 DE+RE · GPIO 16 RO</text><polyline points="1060,380 1380,166.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="1380" y="240" width="360" height="122" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="1560.0" y="288.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Bus I²C: PCF8574 (0x20) · BNO055 (0x28) · VL53L0X</text><text x="1560.0" y="305.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">×4 (0x30 a 0x33; XSHUT por el PCF8574)</text><text x="1560.0" y="321.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 21 SDA · GPIO 22 SCL</text><polyline points="1060,430 1380,301.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="1380" y="370" width="360" height="102" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="1560.0" y="408.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Finales de carrera NC ×3 (elevador I, elevador D,</text><text x="1560.0" y="425.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">home del empujador)</text><text x="1560.0" y="441.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 18 · 19 · 23</text><polyline points="1060,480 1380,421.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="1380" y="480" width="360" height="102" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="1560.0" y="527.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Barra QTR-8A (respaldo): salidas S3 a S7, a 3.3 V</text><text x="1560.0" y="543.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 32 · 33 · 34 · 35 · 36</text><polyline points="1060,530 1380,531.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="1380" y="590" width="360" height="102" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="1560.0" y="637.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Divisor de voltaje de la batería (100 kΩ y 20 kΩ)</text><text x="1560.0" y="653.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 39 · ADC</text><polyline points="1060,580 1380,641.0" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="740" y="840" width="320" height="90" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="900.0" y="872.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Jetson Orin Nano Super</text><text x="900.0" y="889.55" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">órdenes y lecturas por cable USB de</text><text x="900.0" y="907.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">datos</text><polyline points="900,840 900,660" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="910" y="770.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">micro USB (serie)</text><polyline points="900,660 900,840" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="60" y="790" width="560" height="220" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2" stroke-dasharray="7 5"/><text x="70" y="871.725" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">Notas de diseño · GPIO 34, 35, 36 y 39 solo leen. El ENABLE atado a 3.3 V deja</text><text x="70" y="887.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">los motores sueltos mientras el ESP32 arranca. Los finales de carrera NC con</text><text x="70" y="904.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">pull-up leen «presionado» si el cable se rompe y detienen el motor. Micropaso</text><text x="70" y="920.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">1/16 (3200 pulsos por vuelta). Aún no existe el firmware: el programa se hará</text><text x="70" y="936.725" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">con PlatformIO.</text><rect x="1160" y="790" width="580" height="220" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2" stroke-dasharray="7 5"/><text x="1170" y="879.85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">Cableado de la placa perforada de 9 × 15 cm: 107 cables en 14 grupos (potencia de</text><text x="1170" y="896.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">los drivers, lógica, configuración, STEP/DIR/EN, motores, 5 V, 3.3 V y GND,</text><text x="1170" y="912.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">RS485, I²C, XSHUT, finales, QTR, batería, servo y LEDs); cada cable tiene color,</text><text x="1170" y="928.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">calibre y largo en la tabla de cables de la hoja de armado.</text></svg>