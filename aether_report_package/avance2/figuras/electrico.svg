"2" marker-end="url(#ar)"/><polyline points="1160,153 1220,153" fill="none" stroke="#E07B00" stroke-width="2" marker-end="url(#ar)"/><rect x="930" y="300" width="230" height="66" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="1045.0" y="328.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Bornera J1 (12 V)</text><text x="1045.0" y="346.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">3 × A4988 + 100 µF</text><rect x="1220" y="300" width="260" height="66" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="1350.0" y="328.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">3 × NEMA 17</text><text x="1350.0" y="346.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">(elevador ×2 y empujador ×1)</text><polyline points="870,285 900,285 900,333 930,333" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/><polyline points="1160,333 1220,333" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/><rect x="470" y="760" width="160" height="60" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="550.0" y="785.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Fusible 10 A</text><text x="550.0" y="803.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">(rama auxiliar)</text><rect x="680" y="760" width="150" height="60" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="755.0" y="785.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Interruptor KCD1</text><text x="755.0" y="803.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">(encendido)</text><polyline points="630,790 680,790" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/><rect x="890" y="740" width="230" height="100" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="1005.0" y="777.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Reductor XL4005</text><text x="1005.0" y="794.55" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">12 V → 5 V (ajustado a</text><text x="1005.0" y="812.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">5.0–5.1 V)</text><polyline points="830,790 890,790" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/><rect x="1190" y="640" width="250" height="60" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="1315.0" y="665.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">ESP32 · MAX485 · servo MG90S ·</text><text x="1315.0" y="683.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">LEDs (5 V)</text><polyline points="1120,770 1155,770 1155,670 1190,670" fill="none" stroke="#E07B00" stroke-width="2" marker-end="url(#ar)"/><rect x="1190" y="730" width="250" height="60" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="1315.0" y="755.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">Jetson Orin Nano Super</text><text x="1315.0" y="773.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">(12 V por plug 5.5 × 2.5)</text><polyline points="1120,790 1190,760" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/><rect x="1190" y="820" width="250" height="60" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="1315.0" y="846.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Divisor 100 kΩ / 20 kΩ → GPIO 39</text><text x="1315.0" y="862.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">(lectura de batería)</text><polyline points="1120,810 1155,810 1155,850 1190,850" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/><rect x="930" y="500" width="250" height="76" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="1055.0" y="533.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1B2A41">Paro de emergencia LAY37</text><text x="1055.0" y="551.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1B2A41">contacto normalmente cerrado</text><polyline points="830,760 830,705 1055,705 1055,576" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/><polyline points="930,538 775,538 775,300" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ard)"/><text x="800" y="528.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#C0392B">VCC de la bobina del relé</text><rect x="1500" y="440" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2" stroke-dasharray="7 5"/><text x="1630.0" y="474.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" fill="#8A93A0">GND</text><text x="1630.0" y="491.75000000000006" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Tierra común (negativo de la</text><text x="1630.0" y="508.00000000000006" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">batería) unida en un solo punto:</text><text x="1630.0" y="524.25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">borne IN− del elevador de voltaje</text><rect x="60" y="880" width="760" height="130" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2" stroke-dasharray="7 5"/><text x="70" y="932.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">Funcionamiento del paro: al pulsarlo se abre el contacto NC, la bobina del relé queda sin energía y el relé</text><text x="70" y="949.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">cae solo: se cortan a la vez los 18 V de las ruedas y los 12 V de los drivers de los motores a pasos. La</text><text x="70" y="965.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1B2A41">rama auxiliar (Jetson y lógica) sigue viva. Hoy el paro no va a ningún pin del ESP32 (decisión abierta).</text><rect x="1500" y="640" width="270" height="240" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2" stroke-dasharray="7 5"/><text x="1510" y="733.9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1B2A41">Leyenda · rojo: 12 V · naranja: 18 V y</text><text x="1510" y="748.9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1B2A41">5 V · línea punteada: señal de control</text><text x="1510" y="763.9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1B2A41">del paro · calibres de la hoja: 14 AWG</text><text x="1510" y="778.9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1B2A41">batería y rama de motores, 16–18 AWG</text><text x="1510" y="793.9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1B2A41">hacia las ruedas, 22 AWG señal.</text></svg>