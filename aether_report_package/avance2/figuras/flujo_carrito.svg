<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1890" viewBox="0 0 1300 1890"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7685"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="290.0" y="30" width="360" height="56" rx="28" fill="#1B2A41" stroke="#1B2A41" stroke-width="2"/><text x="470.0" y="53.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">INICIO · carrito encendido (KCD1), paro suelto</text><text x="470.0" y="71.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">y relé cerrado</text><rect x="290.0" y="120" width="360" height="70" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="470.0" y="142.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Navegar a la banda por waypoints (máx. 0.35 m/s y</text><text x="470.0" y="159.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">0.4 m/s²); los VL53L0X frenan si algo está a &lt; 40</text><text x="470.0" y="175.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">cm</text><rect x="290.0" y="224" width="360" height="62" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="470.0" y="251.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Acople: el embudo centra el frente y el ArUco</text><text x="470.0" y="267.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">confirma la posición (±5 mm)</text><rect x="290.0" y="320" width="360" height="70" rx="10" fill="#EEF0F3" stroke="#6B7685" stroke-width="2"/><text x="470.0" y="342.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Home del elevador y del empujador (finales de</text><text x="470.0" y="359.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">carrera); plataforma a 82.7 cm, 3 mm bajo la</text><text x="470.0" y="375.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">cinta</text><rect x="290.0" y="424" width="360" height="52" rx="10" fill="#EEF0F3" stroke="#6B7685" stroke-width="2"/><text x="470.0" y="446.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Avisar «listo»; se coloca un fixture en la punta</text><text x="470.0" y="462.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">lejana de la banda</text><rect x="290.0" y="510" width="360" height="66" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="470.0" y="530.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">El fixture viaja con la cinta, baja a la pila y</text><text x="470.0" y="547.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">cae plano ≈ 6 cm afuera de la ventana; la cámara</text><text x="470.0" y="563.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">lee su QR</text><rect x="290.0" y="610" width="360" height="86" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="470.0" y="640.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">La uña baja → el empujador jala ≈ 7.7 cm → la uña</text><text x="470.0" y="657.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">sube → el empujador regresa a home → la</text><text x="470.0" y="673.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">plataforma baja 7 cm</text><polyline points="470,86 470,120" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,190 470,224" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,286 470,320" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,390 470,424" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,476 470,510" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,576 470,610" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,696 470,735" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polygon points="470,740.0 640.0,800 470,860.0 300.0,800" fill="#FFF4D6" stroke="#B98A00" stroke-width="2"/><text x="470" y="803.9000000000001" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1B2A41">¿La pila ya tiene 6 fixtures?</text><polyline points="300,800 110,800 110,450 290.0,450" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="122" y="788.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">No: esperar el siguiente</text><polyline points="470,860 470,905" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="478" y="890.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">Sí</text><rect x="290.0" y="905" width="360" height="62" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="470.0" y="932.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Viaje a la estación de descarga: waypoints,</text><text x="470.0" y="948.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">odometría con encoders e IMU</text><rect x="290.0" y="1000" width="360" height="60" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="470.0" y="1026.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">El embudo y el ArUco centran el carrito; home del</text><text x="470.0" y="1042.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">elevador</text><rect x="290.0" y="1094" width="360" height="72" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="470.0" y="1117.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">El elevador sube por pasos contados hasta que el</text><text x="470.0" y="1134.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">fixture de arriba queda en la ventana (el VL53L0X</text><text x="470.0" y="1150.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">lo confirma)</text><rect x="290.0" y="1200" width="360" height="72" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="470.0" y="1232.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">El empujador avanza 25 cm: el fixture sale a la</text><text x="470.0" y="1248.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">mesa inclinada (≈ 15°) y resbala hasta el tope</text><polyline points="470,967 470,1000" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,1060 470,1094" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,1166 470,1200" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,1272 470,1310" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polygon points="470,1315.0 640.0,1375 470,1435.0 300.0,1375" fill="#FFF4D6" stroke="#B98A00" stroke-width="2"/><text x="470" y="1378.9" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1B2A41">¿Quedan fixtures en la torre?</text><polyline points="640,1375 870,1375 870,1130 650.0,1130" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="700" y="1363.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">Sí: subir un nivel</text><polyline points="470,1435 470,1480" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="478" y="1470.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">No</text><rect x="290.0" y="1480" width="360" height="62" rx="10" fill="#EBE3F6" stroke="#7B52B5" stroke-width="2"/><text x="470.0" y="1507.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Registrar las observaciones (JSON) en la laptop y</text><text x="470.0" y="1523.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">regresar a la banda</text><polyline points="470,1542 470,1590" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="290.0" y="1590" width="360" height="54" rx="27" fill="#1B2A41" stroke="#1B2A41" stroke-width="2"/><text x="470.0" y="1613.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">FIN del ciclo · el paro corta el relé en</text><text x="470.0" y="1629.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">cualquier momento</text><polyline points="650.0,1617 1000,1617 1000,155 650.0,155" fill="none" stroke="#6B7685" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ard)"/><text x="1005" y="900.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#6B7685">otro ciclo</text><rect x="760" y="1680" width="480" height="150" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2" stroke-dasharray="7 5"/><text x="1000.0" y="1726.0749999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" fill="#8A93A0">Nota</text><text x="1000.0" y="1743.6249999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Estado: diseño documentado en la hoja de armado (revisión 3.8). El</text><text x="1000.0" y="1759.8749999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">firmware del ESP32 y la prueba con el carrito armado están</text><text x="1000.0" y="1776.1249999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">pendientes; los tiempos son los de la hoja (≈ 7 s por nivel y ≈ 18</text><text x="1000.0" y="1792.3749999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">s por fixture).</text></svg>