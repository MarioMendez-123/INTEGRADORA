<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1830" viewBox="0 0 1240 1830"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7685"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="300.0" y="40" width="340" height="54" rx="27" fill="#1B2A41" stroke="#1B2A41" stroke-width="2"/><text x="470.0" y="62.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">INICIO · celda energizada, cámara abierta y</text><text x="470.0" y="80.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">modelo ONNX cargado</text><rect x="300.0" y="130" width="340" height="58" rx="10" fill="#EEF0F3" stroke="#6B7685" stroke-width="2"/><text x="470.0" y="154.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">El operador inicia sesión en la HMI y pulsa</text><text x="470.0" y="172.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">ARRANQUE (pide confirmación)</text><rect x="300.0" y="222" width="340" height="52" rx="10" fill="#E3EEF9" stroke="#2F6DB5" stroke-width="2"/><text x="470.0" y="252.55" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">La cámara USB captura un cuadro cada 0.5 s</text><rect x="300.0" y="308" width="340" height="58" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="470.0" y="324.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">YOLO (modelo ONNX en la Raspberry Pi 4)</text><text x="470.0" y="341.55" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">detecta objetos; umbral interno de</text><text x="470.0" y="359.05" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1B2A41">confianza 0.25</text><rect x="300.0" y="400" width="340" height="70" rx="10" fill="#DDF2EF" stroke="#1E8E7E" stroke-width="2"/><text x="470.0" y="414.85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Juicio del cuadro: PASS si hay una pieza</text><text x="470.0" y="431.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">registrada con confianza ≥ 0.50 y sin</text><text x="470.0" y="447.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">ambigüedad; FAIL si no lo es; SIN_PIEZA si no</text><text x="470.0" y="463.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">hay nada</text><polyline points="470,94 470,130" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,188 470,222" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,274 470,308" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,366 470,400" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,470 470,505" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polygon points="470,505.0 635.0,560 470,615.0 305.0,560" fill="#FFF4D6" stroke="#B98A00" stroke-width="2"/><text x="470" y="563.9000000000001" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1B2A41">¿5 juicios iguales seguidos?</text><polyline points="305,560 170,560 170,248 300.0,248" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="178" y="548.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">No</text><polyline points="470,615 470,650" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="478" y="640.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">Sí</text><polygon points="470,650.0 635.0,705 470,760.0 305.0,705" fill="#FFF4D6" stroke="#B98A00" stroke-width="2"/><text x="470" y="708.9000000000001" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1B2A41">¿El juicio es SIN_PIEZA?</text><rect x="700" y="680" width="280" height="50" rx="10" fill="#EEF0F3" stroke="#6B7685" stroke-width="2"/><text x="840.0" y="709.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Rearmar: permitir una pieza nueva</text><polyline points="635,705 700,705" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="648" y="694.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">Sí</text><polyline points="840,680 840,248 640.0,248" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="470,760 470,795" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="478" y="785.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">No</text><polygon points="470,795.0 635.0,850 470,905.0 305.0,850" fill="#FFF4D6" stroke="#B98A00" stroke-width="2"/><text x="470" y="853.9000000000001" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1B2A41">¿El juicio es FAIL?</text><polyline points="305,850 230,850 230,925" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="236" y="838.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">No (PASS)</text><rect x="100" y="925" width="260" height="118" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="230.0" y="963.85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 9: pulso de 0.5 s → relevador</text><text x="230.0" y="980.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">→ entrada I4 del LOGO!; la banda</text><text x="230.0" y="996.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">avanza (el LOGO! ignora su</text><text x="230.0" y="1012.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">infrarrojo 5 s)</text><polyline points="230,1043 230,1090" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="100" y="1090" width="260" height="70" rx="10" fill="#EBE3F6" stroke="#7B52B5" stroke-width="2"/><text x="230.0" y="1121.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Anotar acción: pieza_aceptada (la</text><text x="230.0" y="1137.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">pieza sigue hacia el carrito)</text><polyline points="635,850 880,850 880,925" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="760" y="838.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">Sí (FAIL)</text><rect x="740" y="925" width="280" height="52" rx="10" fill="#EEF0F3" stroke="#6B7685" stroke-width="2"/><text x="880.0" y="947.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Esperar 3 s: la pieza llega frente al</text><text x="880.0" y="963.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">pistón</text><polyline points="880.0,977 880.0,1010" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="740" y="1010" width="280" height="92" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="880.0" y="1043.975" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 8 en alto 1 s: relevador →</text><text x="880.0" y="1060.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">electroválvula de 24 V → el pistón</text><text x="880.0" y="1076.475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">expulsa la pieza</text><polyline points="880.0,1102 880.0,1135" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="740" y="1135" width="280" height="66" rx="10" fill="#EEF0F3" stroke="#6B7685" stroke-width="2"/><text x="880.0" y="1164.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 8 en bajo; esperar 2 s a que el</text><text x="880.0" y="1180.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">pistón regrese</text><polyline points="880.0,1201 880.0,1234" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="740" y="1234" width="280" height="82" rx="10" fill="#FBE6DD" stroke="#C8501E" stroke-width="2"/><text x="880.0" y="1271.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">GPIO 9: pulso de 0.5 s → I4 del LOGO!;</text><text x="880.0" y="1287.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">la banda avanza</text><polyline points="880.0,1316 880.0,1349" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="740" y="1349" width="280" height="56" rx="10" fill="#EBE3F6" stroke="#7B52B5" stroke-width="2"/><text x="880.0" y="1381.225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Anotar acción: scrap_expulsado</text><polyline points="230,1160 230,1455 300.0,1455" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polyline points="880.0,1405 880.0,1455 640.0,1455" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><rect x="300.0" y="1415" width="340" height="80" rx="10" fill="#EBE3F6" stroke="#7B52B5" stroke-width="2"/><text x="470.0" y="1434.85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Registrar el evento (pieza, juicio, acción,</text><text x="470.0" y="1451.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">hora) con event_id; actualizar contadores y</text><text x="470.0" y="1467.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">alarmas de la HMI; enviar POST</text><text x="470.0" y="1483.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">/line/cell/events a la laptop</text><polyline points="470,1495 470,1535" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><polygon points="470,1535.0 635.0,1590 470,1645.0 305.0,1590" fill="#FFF4D6" stroke="#B98A00" stroke-width="2"/><text x="470" y="1593.9" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1B2A41">¿El operador pulsó PARO?</text><polyline points="305,1590 40,1590 40,248 300.0,248" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="48" y="1578.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">No</text><polyline points="470,1645 470,1690" fill="none" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/><text x="478" y="1678.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#1B2A41">Sí</text><rect x="300.0" y="1690" width="340" height="54" rx="27" fill="#1B2A41" stroke="#1B2A41" stroke-width="2"/><text x="470.0" y="1713.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">FIN · set_running(False) aborta el ciclo y</text><text x="470.0" y="1729.35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">apaga GPIO 8 y GPIO 9</text><rect x="700" y="1480" width="480" height="112" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2" stroke-dasharray="7 5"/><text x="940.0" y="1515.1999999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" fill="#C0392B">Salvaguarda</text><text x="940.0" y="1532.7499999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Sin la librería gpiod o sin relevador, nada se mueve: PASS queda</text><text x="940.0" y="1548.9999999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">como pulso_no_enviado y FAIL como fallo_actuacion; la HMI levanta</text><text x="940.0" y="1565.2499999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">la alarma de prioridad 1 «FAIL sin expulsar».</text><rect x="700" y="1612" width="480" height="150" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2" stroke-dasharray="7 5"/><text x="940.0" y="1658.0749999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" fill="#8A93A0">Nota de diseño (por confirmar)</text><text x="940.0" y="1675.6249999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">Diseño del reporte HMI (Unidad III): la Pi escribe Vision_Resultado</text><text x="940.0" y="1691.8749999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">y Vision_Secuencia por Modbus TCP, espera el acuse Plc_AckSecuencia</text><text x="940.0" y="1708.1249999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">del LOGO! y solo entonces pulsa el avance. No forma parte del</text><text x="940.0" y="1724.3749999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1B2A41">código del repositorio al 24 de octubre de 2026.</text></svg>