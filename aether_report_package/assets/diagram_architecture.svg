<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" width="1400" height="540">
  <rect width="1400" height="540" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B4FE8"/>
    </marker>
  </defs>

  <!-- Row 1: Robot -> Sensores -> Edge Compute -->
  <rect x="40" y="40" width="220" height="90" rx="6" fill="#F4F3FF" stroke="#5B4FE8" stroke-width="2"/>
  <text x="150" y="78" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#14171F" text-anchor="middle">Robot</text>
  <text x="150" y="102" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#14171F" text-anchor="middle">móvil</text>
  <line x1="260" y1="85" x2="325" y2="85" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="325" y="40" width="220" height="90" rx="6" fill="#F4F3FF" stroke="#5B4FE8" stroke-width="2"/>
  <text x="435" y="90" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#14171F" text-anchor="middle">Sensores</text>
  <line x1="545" y1="85" x2="610" y2="85" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="610" y="40" width="260" height="90" rx="6" fill="#F4F3FF" stroke="#5B4FE8" stroke-width="2"/>
  <text x="740" y="78" font-family="IBM Plex Sans" font-size="19" font-weight="600" fill="#14171F" text-anchor="middle">Edge compute</text>
  <text x="740" y="102" font-family="IBM Plex Mono" font-size="13" fill="#6B7280" text-anchor="middle">Jetson Orin Nano Super</text>
  <line x1="870" y1="85" x2="935" y2="85" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="935" y="40" width="260" height="90" rx="6" fill="#EAF7F0" stroke="#34C77B" stroke-width="2"/>
  <text x="1065" y="90" font-family="IBM Plex Sans" font-size="19" font-weight="600" fill="#14171F" text-anchor="middle">Percepción</text>
  <text x="1065" y="112" font-family="IBM Plex Mono" font-size="12" fill="#1E8E52" text-anchor="middle">YOLO + código + ArUco</text>

  <!-- turn down -->
  <path d="M 1065 130 L 1065 165 L 1065 195" fill="none" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Percepcion col -> Navegacion (middle) -> Inventory engine (left), right to left -->
  <rect x="935" y="195" width="260" height="90" rx="6" fill="#FDF3E4" stroke="#E8A33D" stroke-width="2"/>
  <text x="1065" y="233" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#14171F" text-anchor="middle">Navegación +</text>
  <text x="1065" y="257" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#14171F" text-anchor="middle">visión</text>
  <line x1="935" y1="240" x2="870" y2="240" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="610" y="195" width="260" height="90" rx="6" fill="#EAF7F0" stroke="#34C77B" stroke-width="2"/>
  <text x="740" y="245" font-family="IBM Plex Sans" font-size="19" font-weight="600" fill="#14171F" text-anchor="middle">Inventory Engine</text>

  <path d="M 740 285 L 740 320 L 740 350" fill="none" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Row 3: Backend -> Database -> Dashboard, left to right -->
  <rect x="610" y="350" width="220" height="90" rx="6" fill="#EAF7F0" stroke="#34C77B" stroke-width="2"/>
  <text x="720" y="400" font-family="IBM Plex Sans" font-size="19" font-weight="600" fill="#14171F" text-anchor="middle">Backend</text>
  <line x1="830" y1="395" x2="895" y2="395" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="895" y="350" width="220" height="90" rx="6" fill="#EAF7F0" stroke="#34C77B" stroke-width="2"/>
  <text x="1005" y="390" font-family="IBM Plex Sans" font-size="19" font-weight="600" fill="#14171F" text-anchor="middle">Database</text>
  <text x="1005" y="412" font-family="IBM Plex Mono" font-size="12" fill="#1E8E52" text-anchor="middle">SQLite</text>
  <line x1="1115" y1="395" x2="1175" y2="395" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1175" y="350" width="185" height="90" rx="6" fill="#EAF7F0" stroke="#34C77B" stroke-width="2"/>
  <text x="1267" y="400" font-family="IBM Plex Sans" font-size="19" font-weight="600" fill="#14171F" text-anchor="middle">Dashboard</text>

  <!-- Legend -->
  <g>
    <rect x="40" y="495" width="18" height="18" fill="#EAF7F0" stroke="#34C77B" stroke-width="2"/>
    <text x="66" y="509" font-family="IBM Plex Mono" font-size="14" fill="#14171F">Funcionando con hardware real</text>

    <rect x="420" y="495" width="18" height="18" fill="#FDF3E4" stroke="#E8A33D" stroke-width="2"/>
    <text x="446" y="509" font-family="IBM Plex Mono" font-size="14" fill="#14171F">Pendiente de hardware físico</text>

    <rect x="760" y="495" width="18" height="18" fill="#F4F3FF" stroke="#5B4FE8" stroke-width="2"/>
    <text x="786" y="509" font-family="IBM Plex Mono" font-size="14" fill="#14171F">Arquitectura decidida, en espera</text>
  </g>
</svg>
