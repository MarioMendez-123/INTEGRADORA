<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <rect width="1400" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B4FE8"/>
    </marker>
  </defs>

  <!-- 4 stations left to right -->
  <rect x="30" y="90" width="290" height="110" rx="6" fill="#FDF3E4" stroke="#E8A33D" stroke-width="2"/>
  <text x="175" y="135" font-family="IBM Plex Sans" font-size="21" font-weight="600" fill="#14171F" text-anchor="middle">KUKA KR6</text>
  <text x="175" y="160" font-family="IBM Plex Sans" font-size="14" fill="#5A5F6E" text-anchor="middle">Coloca la pieza en la</text>
  <text x="175" y="178" font-family="IBM Plex Sans" font-size="14" fill="#5A5F6E" text-anchor="middle">banda transportadora</text>

  <line x1="320" y1="145" x2="380" y2="145" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="350" y="130" font-family="IBM Plex Mono" font-size="11" fill="#5B4FE8" text-anchor="middle">I/O</text>

  <rect x="380" y="90" width="290" height="110" rx="6" fill="#FDF3E4" stroke="#E8A33D" stroke-width="2"/>
  <text x="525" y="135" font-family="IBM Plex Sans" font-size="21" font-weight="600" fill="#14171F" text-anchor="middle">UR5</text>
  <text x="525" y="160" font-family="IBM Plex Sans" font-size="14" fill="#5A5F6E" text-anchor="middle">Ensambla con trayectorias</text>
  <text x="525" y="178" font-family="IBM Plex Sans" font-size="14" fill="#5A5F6E" text-anchor="middle">pre-programadas</text>

  <line x1="670" y1="145" x2="730" y2="145" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="700" y="130" font-family="IBM Plex Mono" font-size="11" fill="#5B4FE8" text-anchor="middle">I/O</text>

  <rect x="730" y="90" width="290" height="110" rx="6" fill="#EAF7F0" stroke="#34C77B" stroke-width="2"/>
  <text x="875" y="135" font-family="IBM Plex Sans" font-size="21" font-weight="600" fill="#14171F" text-anchor="middle">Visión de línea</text>
  <text x="875" y="160" font-family="IBM Plex Sans" font-size="14" fill="#1E8E52" text-anchor="middle">Confirmación binaria</text>
  <text x="875" y="178" font-family="IBM Plex Sans" font-size="14" fill="#1E8E52" text-anchor="middle">de ensamble (sí / no)</text>

  <line x1="1020" y1="145" x2="1080" y2="145" stroke="#5B4FE8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="1050" y="130" font-family="IBM Plex Mono" font-size="11" fill="#5B4FE8" text-anchor="middle">MQTT</text>

  <rect x="1080" y="90" width="290" height="110" rx="6" fill="#FDF3E4" stroke="#E8A33D" stroke-width="2"/>
  <text x="1225" y="135" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#14171F" text-anchor="middle">Aether Inventory</text>
  <text x="1225" y="160" font-family="IBM Plex Sans" font-size="14" fill="#5A5F6E" text-anchor="middle">Recoge y transporta la</text>
  <text x="1225" y="178" font-family="IBM Plex Sans" font-size="14" fill="#5A5F6E" text-anchor="middle">pieza terminada</text>

  <!-- listener below -->
  <line x1="875" y1="200" x2="875" y2="255" stroke="#8A93A6" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="655" y="255" width="440" height="70" rx="6" fill="#F4F3FF" stroke="#5B4FE8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="875" y="284" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#14171F" text-anchor="middle">Listener MQTT</text>
  <text x="875" y="304" font-family="IBM Plex Mono" font-size="12" fill="#5A5F6E" text-anchor="middle">registra cada evento como Observation — no controla nada</text>

  <text x="30" y="365" font-family="IBM Plex Mono" font-size="13" fill="#5A5F6E">Sin orquestador central — handshake punto a punto entre estaciones (Decisión 8a)</text>
</svg>
