# Borde público de aethermx.online.
# GitHub Pages no deja poner estas cabeceras. Hacen falta aquí, o en
# Cloudflare (reglas de transformación equivalentes, más abajo).
# El laboratorio (uvicorn en localhost:8000) no usa este archivo.

server {
    listen 80;
    server_name aethermx.online www.aethermx.online;
    return 301 https://aethermx.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.aethermx.online;
    # ssl_certificate     /etc/letsencrypt/live/aethermx.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aethermx.online/privkey.pem;
    return 301 https://aethermx.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aethermx.online;
    # ssl_certificate     /etc/letsencrypt/live/aethermx.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aethermx.online/privkey.pem;

    # script-src lleva 'unsafe-inline' porque armado.html tiene el import map
    # y el módulo 3D en línea. style-src también: hay style="--i" y un <style>.
    # El texto para pegar en Cloudflare está en docs/security/runbook-cloudflare.md.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* (^|/)\.(env|git)|(\.bak|\.sql|\.sqlite|\.db)$ {
        return 404;
    }

    # Cámara, pistón, banda, LOGO, robot, dataset y websockets.
    # No se proxyean al laboratorio.
    location ~ ^/(perception|line|robot|dataset|spotify|show)(/|$) {
        default_type application/json;
        return 403 '{"detail":"No disponible"}';
    }

    # Inventario de solo lectura, si más adelante publicas la API.
    # Quita este bloque mientras el dominio solo sirva GitHub Pages.
    # location ~ ^/(health|inventory)$ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_method GET;
    #     limit_except GET HEAD { deny all; }
    # }

    location / {
        # Origen actual: GitHub Pages. No pongas aquí la IP de tu casa.
        proxy_pass https://mariomendez-123.github.io;
        proxy_set_header Host mariomendez-123.github.io;
        proxy_ssl_server_name on;
    }
}

# MQTT (1883/8883) no va en este server. Si aparece un broker, que escuche
# solo en 127.0.0.1 dentro del laboratorio.
#
# Cloudflare (equivalente, sin nginx):
# 1. El dominio pasa a los nameservers de Cloudflare. Nube naranja en los
#    A/CNAME que ya apuntan a GitHub Pages. El visitante ve IPs de
#    Cloudflare, no las de GitHub ni las de un servidor propio.
# 2. SSL/TLS = Full (strict). Always Use HTTPS = on. HSTS como arriba.
# 3. Transform Rules → Modify Response Header, con las mismas cabeceras.
# 4. WAF custom rule: si el path empieza por /perception, /line, /robot,
#    /dataset, /spotify o /show, Block.
# 5. Bot Fight Mode y el rate limit del plan que tengas, en /inventory.
# 6. No crees un registro DNS hacia la IP pública del laboratorio.
#
# Correo (ImprovMX). Confírmalos en el panel antes de publicarlos; un SPF
# mal puesto tira el reenvío.
#   TXT @     v=spf1 include:spf.improvmx.com ~all
#   TXT _dmarc  v=DMARC1; p=none; rua=mailto:mario@aethermx.online
#   DKIM: el CNAME que muestre ImprovMX. No inventes la clave.
