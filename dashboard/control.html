<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Aether · Control remoto</title>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #05070a; color: #f2f3f8; font-family: "Inter", system-ui, sans-serif; overscroll-behavior: none; }
      main { height: 100%; display: flex; flex-direction: column; gap: 14px; padding: 16px; }
      header { display: flex; justify-content: space-between; align-items: center; font: 500 15px "IBM Plex Mono", monospace; color: #9aa1b8; }
      #dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ff5d6c; margin-right: 8px; }
      #dot.on { background: #3ddc97; }
      button { font: 700 22px "Inter", system-ui, sans-serif; color: #f2f3f8; background: #171a33; border: 2px solid #5b4fe8; border-radius: 16px; padding: 18px; touch-action: manipulation; }
      button:active { background: #2b2f66; }
      #next { flex: 3; font-size: 44px; background: #3b32a8; border-color: #8b7fff; }
      #prev { flex: 1.3; font-size: 30px; }
      .row { display: flex; gap: 14px; }
      .row button { flex: 1; font-size: 18px; padding: 14px; }
      #msg { text-align: center; font: 500 14px "IBM Plex Mono", monospace; color: #9aa1b8; min-height: 18px; }
    </style>
  </head>
  <body>
    <main>
      <header><span><i id="dot"></i><span id="st">conectando…</span></span><span>AETHER</span></header>
      <button id="next" data-key="ArrowRight">Siguiente ▶</button>
      <button id="prev" data-key="ArrowLeft">◀ Atrás</button>
      <div class="row">
        <button data-key="-">Música −</button>
        <button data-key="m">Silenciar</button>
        <button data-key="+">Música +</button>
      </div>
      <div class="row"><button data-wake="1">Despertar a Lumina</button></div>
      <div id="msg"></div>
    </main>
    <script src="/control.js"></script>
  </body>
</html>
